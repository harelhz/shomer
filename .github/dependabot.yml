version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        patterns: ['*']
    ignore:
      # typescript-eslint 8 supports TypeScript < 6.1 only; TS 7 makes npm ci fail
      # with ERESOLVE (see the failing dev-dependencies PR). Remove once it does.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
