name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, to catch filter-list changes the compiler can't handle.
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Compile filter lists
        run: npm run lists
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  build:
    name: Build, end-to-end tests, package
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Validate the Firefox build
        run: npx --yes web-ext@8 lint --source-dir dist/firefox
      - run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: shomer-extensions
          path: artifacts/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: filter-compile-report
          path: build/report.json
