<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>OneTrust banner</title>
  </head>
  <body>
    <p>Content</p>
    <script>
      // Inserted late, like a real CMP.
      setTimeout(() => {
        const banner = document.createElement('div');
        banner.id = 'onetrust-banner-sdk';
        banner.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:#eee;padding:20px';
        banner.innerHTML =
          '<p>We use cookies to improve your experience.</p>' +
          '<button id="onetrust-accept-btn-handler">Accept all</button>' +
          '<button id="onetrust-reject-all-handler">Reject all</button>';
        banner.querySelector('#onetrust-accept-btn-handler').onclick = () => {
          window.consent = 'accepted';
          banner.remove();
        };
        banner.querySelector('#onetrust-reject-all-handler').onclick = () => {
          window.consent = 'rejected';
          banner.remove();
        };
        document.body.appendChild(banner);
      }, 300);
    </script>
  </body>
</html>
