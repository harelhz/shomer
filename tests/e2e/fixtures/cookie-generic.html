<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>אתר ישראלי</title>
  </head>
  <body style="overflow: hidden">
    <p>תוכן האתר</p>
    <div
      id="my-privacy-bar"
      class="site-notice"
      style="position: fixed; bottom: 0; left: 0; right: 0; background: #fff; padding: 24px"
    >
      <span>אתר זה משתמש בעוגיות (cookies) כדי לשפר את חווית הגלישה שלך.</span>
      <button onclick="window.consent = 'accepted'">אישור</button>
      <button onclick="window.consent = 'rejected'">דחה הכל</button>
    </div>
  </body>
</html>
